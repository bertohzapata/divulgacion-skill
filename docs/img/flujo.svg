<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="300" rx="16" fill="#FAF8F3"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1E222D">Cómo trabaja la skill</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <!-- fila de pasos -->
  <g font-size="14" fill="#1E222D">
    <rect x="32" y="80" width="132" height="120" rx="12" fill="#FFFFFF" stroke="#E4E0D6"/>
    <text x="50" y="112" font-size="28">📝</text>
    <text x="50" y="146" font-weight="700">1. Brief</text>
    <text x="50" y="168" fill="#5B6170" font-size="12">tema, público,</text>
    <text x="50" y="184" fill="#5B6170" font-size="12">formato, perfil</text>

    <rect x="186" y="80" width="132" height="120" rx="12" fill="#FFF4EC" stroke="#EA580C" stroke-width="2"/>
    <text x="204" y="112" font-size="28">🎯</text>
    <text x="204" y="146" font-weight="700">2. Ángulo</text>
    <text x="204" y="168" fill="#5B6170" font-size="12">¿cómo es posible?</text>
    <text x="204" y="184" fill="#5B6170" font-size="12">error común · ABT</text>

    <rect x="340" y="80" width="132" height="120" rx="12" fill="#FFFFFF" stroke="#E4E0D6"/>
    <text x="358" y="112" font-size="28">🧱</text>
    <text x="358" y="146" font-weight="700">3. Estructura</text>
    <text x="358" y="168" fill="#5B6170" font-size="12">corto o largo,</text>
    <text x="358" y="184" fill="#5B6170" font-size="12">gancho, marco</text>

    <rect x="494" y="80" width="132" height="120" rx="12" fill="#FFFFFF" stroke="#E4E0D6"/>
    <text x="512" y="112" font-size="28">✍️</text>
    <text x="512" y="146" font-weight="700">4. Guion</text>
    <text x="512" y="168" fill="#5B6170" font-size="12">se dice · se ve ·</text>
    <text x="512" y="184" fill="#5B6170" font-size="12">para qué sirve</text>

    <rect x="648" y="80" width="132" height="120" rx="12" fill="#FFFFFF" stroke="#E4E0D6"/>
    <text x="666" y="112" font-size="28">🔍</text>
    <text x="666" y="146" font-weight="700">5. Revisión</text>
    <text x="666" y="168" fill="#5B6170" font-size="12">densidad, rigor,</text>
    <text x="666" y="184" fill="#5B6170" font-size="12">checklist</text>

    <rect x="802" y="80" width="126" height="120" rx="12" fill="#EEF4FF" stroke="#2563EB" stroke-width="2"/>
    <text x="820" y="112" font-size="28">📦</text>
    <text x="820" y="146" font-weight="700">6. Entrega</text>
    <text x="820" y="168" fill="#5B6170" font-size="12">guion, títulos,</text>
    <text x="820" y="184" fill="#5B6170" font-size="12">fuentes, métricas</text>
  </g>
  <g stroke="#94A3B8" stroke-width="2" marker-end="url(#a)">
    <line x1="166" y1="140" x2="182" y2="140"/>
    <line x1="320" y1="140" x2="336" y2="140"/>
    <line x1="474" y1="140" x2="490" y2="140"/>
    <line x1="628" y1="140" x2="644" y2="140"/>
    <line x1="782" y1="140" x2="798" y2="140"/>
  </g>
  <text x="32" y="246" font-size="13" fill="#5B6170">El paso 2 es el corazón: sin una pregunta "¿cómo es posible?" y una frase "y… pero… por lo tanto…", todavía no hay historia, solo una lista de datos.</text>
  <text x="32" y="270" font-size="13" fill="#5B6170">Si existe un perfil de voz en <tspan font-family="Consolas, monospace" fill="#1E222D">perfiles/</tspan>, se aplica en todos los pasos.</text>
</svg>
