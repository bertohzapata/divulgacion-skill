<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="250" rx="16" fill="#FAF8F3"/>
  <text x="32" y="42" font-size="20" font-weight="700" fill="#1E222D">ABT: de lista de datos a historia</text>
  <text x="32" y="64" font-size="12" fill="#5B6170">Randy Olson · "And, But, Therefore"</text>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect x="32" y="84" width="270" height="110" rx="12" fill="#FFFFFF" stroke="#E4E0D6"/>
  <text x="50" y="114" font-size="18" font-weight="700" fill="#1E222D">Y…</text>
  <text x="96" y="114" font-size="12" fill="#5B6170">contexto</text>
  <text x="50" y="142" font-size="13" fill="#1E222D">Shazam reconoce una canción</text>
  <text x="50" y="161" font-size="13" fill="#1E222D">entre millones en segundos…</text>

  <rect x="345" y="84" width="270" height="110" rx="12" fill="#FFF4EC" stroke="#EA580C" stroke-width="2"/>
  <text x="363" y="114" font-size="18" font-weight="700" fill="#C2410C">PERO…</text>
  <text x="432" y="114" font-size="12" fill="#5B6170">tensión / misterio</text>
  <text x="363" y="142" font-size="13" fill="#1E222D">comparar audio así es</text>
  <text x="363" y="161" font-size="13" fill="#1E222D">carísimo y lentísimo…</text>

  <rect x="658" y="84" width="270" height="110" rx="12" fill="#EEF4FF" stroke="#2563EB" stroke-width="2"/>
  <text x="676" y="114" font-size="18" font-weight="700" fill="#1D4ED8">POR LO TANTO…</text>
  <text x="676" y="142" font-size="13" fill="#1E222D">¿qué truco usaron? Vamos</text>
  <text x="676" y="161" font-size="13" fill="#1E222D">a descubrirlo paso a paso.</text>

  <g stroke="#94A3B8" stroke-width="2" marker-end="url(#b)">
    <line x1="304" y1="139" x2="340" y2="139"/>
    <line x1="617" y1="139" x2="653" y2="139"/>
  </g>
  <text x="32" y="226" font-size="13" fill="#5B6170">Regla de edición ("But/Therefore", Trey Parker): si dos ideas se unen con "y luego", sobra una o falta tensión.</text>
</svg>
